name: Windows 便携版发布

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: 校验版本
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw '版本标签与 package.json 不一致。' }
      - name: 构建便携 EXE
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run dist
      - name: 发布到 GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $name = "Jinkra-Toolbox-$version-x64.exe"
          $exe = Join-Path 'release' $name
          $sha = "$exe.sha256"
          $digest = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath $sha -Value "$digest  $name" -Encoding ascii
          gh release create $env:GITHUB_REF_NAME $exe $sha --verify-tag --title "Jinkra 工具箱 $version" --generate-notes
