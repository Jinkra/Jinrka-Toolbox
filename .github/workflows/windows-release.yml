name: Windows 便携版发布

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 版本标签
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    concurrency:
      group: windows-release-${{ inputs.tag || github.ref_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: 校验版本
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:RELEASE_TAG -ne "v$version") { throw '版本标签与 package.json 不一致。' }
      - name: 构建便携 EXE
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run dist
      - name: 签名更新清单
        shell: pwsh
        env:
          JINKRA_UPDATE_SIGNING_KEY: ${{ secrets.JINKRA_UPDATE_SIGNING_KEY }}
        run: node scripts/sign-release.cjs
      - name: 发布到 GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $name = "Jinkra-Toolbox-$version-x64.exe"
          $exe = Join-Path 'release' $name
          $sha = "$exe.sha256"
          gh release create $env:RELEASE_TAG $exe $sha 'release/jinkra-update.json' --verify-tag --title "Jinkra 工具箱 $version" --generate-notes
