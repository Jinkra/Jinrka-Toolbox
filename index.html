<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="theme-color" content="#fffeff">
    <link rel="icon" type="image/png" href="/assets/icon.png">
    <title>小金工具箱</title>
    <style>
      body { margin: 0; background: #f2f6fc; }
      #app > .initial-boot { min-height: 100vh; display: grid; place-items: center; font-family: "Microsoft YaHei UI", sans-serif; color: #172c4c; }
      #app > .initial-boot .boot-content { width: min(388px, calc(100vw - 32px)); box-sizing: border-box; padding: 25px; background: #fff; border: 1px solid #dce5f2; border-radius: 22px; animation: startup-fade .20s ease-out both; }
      #app > .initial-boot .boot-mark { display: flex; align-items: center; gap: 15px; }
      #app > .initial-boot img { border-radius: 12px; }
      #app > .initial-boot h1 { margin: 0 0 3px; font-size: 23px; }
      #app > .initial-boot p { margin: 0; color: #52627b; font-size: 13px; }
      .boot-progress { position: relative; width: 100%; height: 5px; border-radius: 6px; background: #d8e4f7; overflow: hidden; }
      #app > .initial-boot .boot-progress { margin-top: 24px; }
      .boot-progress::after { content: ""; display: block; width: 30%; height: 100%; border-radius: inherit; background: #3869af; animation: startup-sweep 1.25s linear infinite; }
      @keyframes startup-sweep { from { transform: translateX(-100%); } to { transform: translateX(335%); } }
      @keyframes startup-fade { from { opacity: 0; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #app > .initial-boot .boot-content, .boot-progress::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="gateway initial-boot">
        <section class="boot-content" role="status">
          <div class="boot-mark">
            <img class="launch-logo boot-logo" src="/assets/icon.png" alt="" width="57" height="57">
            <div>
              <h1>小金工具箱</h1>
              <p>正在启动…</p>
            </div>
          </div>
          <div class="boot-progress"></div>
        </section>
      </div>
    </div>
    <noscript>请启用 JavaScript 以使用小金工具箱。</noscript>
    <script type="module" src="/src/bootstrap.js"></script>
  </body>
</html>
